<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정답 매기기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #2b1b3d; --ink-soft: #6d5b80; --ink-faint: #a597b5;
  --bg: #f6f0fb; --paper: #ffffff; --tint: #fbf7fe; --line: #eee6f6;
  --lilac: #a98bea; --lilac-soft: #ece4fb; --lilac-deep: #7c5fd6;
  --pink: #f2709c; --sun-soft: #fff4c7; --good: #3fb68b;
  --shadow: 0 10px 30px -12px rgba(124, 95, 214, .28);
  --num: "Outfit", "IBM Plex Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #f1eaf9; --ink-soft: #c2b4d4; --ink-faint: #8a7b9d;
    --bg: #17121e; --paper: #221b2c; --tint: #2a2236; --line: #362c44;
    --lilac-soft: #352a4c; --sun-soft: #3a3320; --shadow: 0 10px 30px -12px rgba(0, 0, 0, .6);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg);
  font: 15px/1.55 "IBM Plex Sans KR", system-ui, sans-serif;
}
.wrap { max-width: 460px; margin: 0 auto; padding: 18px 16px 40px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
h1 { font-size: 18px; margin: 0; }
.count { font-family: var(--num); color: var(--ink-soft); font-size: 14px; white-space: nowrap; }
.bar { height: 6px; border-radius: 99px; background: var(--lilac-soft); overflow: hidden; margin-bottom: 16px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--lilac), var(--pink)); transition: width .25s; }
.card { background: var(--paper); border-radius: 22px; box-shadow: var(--shadow); padding: 20px; }
.when { color: var(--ink-soft); font-size: 13px; }
.name { font-size: 20px; font-weight: 700; margin: 4px 0 2px; word-break: break-all; }
.amount { font-family: var(--num); font-size: 30px; font-weight: 700; letter-spacing: -.5px; }
.kind { display: inline-block; margin-top: 6px; font-size: 12px; color: var(--ink-soft); background: var(--tint);
  border: 1px solid var(--line); border-radius: 99px; padding: 1px 10px; }
.done-badge { float: right; font-size: 12px; font-weight: 600; color: var(--good); }
.near { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 10px; }
.near h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--ink-faint); }
.near div { display: flex; gap: 8px; font-size: 13px; color: var(--ink-soft); }
.near .t { font-family: var(--num); width: 40px; flex: none; }
.near .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.near .a { font-family: var(--num); flex: none; }
.near .in { color: var(--good); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.cat { border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 16px;
  padding: 10px 4px 8px; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600; position: relative; }
.cat .e { display: block; font-size: 22px; line-height: 1.2; }
.cat .k { position: absolute; top: 4px; left: 8px; font: 500 10px var(--num); color: var(--ink-faint); }
.cat:hover { border-color: var(--lilac); }
.cat.on { border-color: var(--lilac-deep); background: var(--lilac-soft); }
.memo { width: 100%; margin-top: 12px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
  border-radius: 14px; padding: 10px 12px; font: inherit; font-size: 14px; }
.same { margin-top: 10px; width: 100%; border: 0; border-radius: 14px; padding: 10px; cursor: pointer;
  background: var(--sun-soft); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; }
.nav { display: flex; gap: 8px; margin-top: 12px; }
.nav button, .save { flex: 1; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink-soft);
  border-radius: 14px; padding: 10px; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600; }
.save { display: block; width: 100%; margin-top: 18px; border: 0; color: #fff;
  background: linear-gradient(90deg, var(--lilac-deep), var(--pink)); }
.hint { margin-top: 10px; font-size: 12px; color: var(--ink-faint); text-align: center; }
.amount.in { color: var(--good); }
.dir { display: inline-block; margin-right: 6px; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 1px 10px;
  background: var(--lilac-soft); color: var(--lilac-deep); }
.dir.in { background: rgba(63, 182, 139, .15); color: var(--good); }
.pays { margin-top: 12px; background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; }
.pays h3 { margin: 0 0 8px; font-size: 14px; }
.pays label { display: flex; align-items: center; gap: 8px; padding: 7px 4px; border-top: 1px solid var(--line);
  font-size: 13px; cursor: pointer; }
.pays label:first-of-type { border-top: 0; }
.pays input { width: 18px; height: 18px; accent-color: var(--lilac-deep); flex: none; }
.pays .t { color: var(--ink-faint); font-family: var(--num); width: 92px; flex: none; }
.pays .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pays .a { font-family: var(--num); flex: none; }
.pays p { margin: 8px 0 0; font-size: 12px; color: var(--ink-faint); }
.finish { text-align: center; padding: 28px 10px; }
.finish b { display: block; font-size: 20px; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>정답 매기기</h1>
    <span class="count" id="count"></span>
  </header>
  <div class="bar"><i id="bar"></i></div>

  <section class="card" id="card">
    <span class="done-badge" id="badge" hidden>✓ 골랐어요</span>
    <div class="when" id="when"></div>
    <div class="name" id="name"></div>
    <div class="amount" id="amount"></div>
    <span class="dir" id="dir"></span><span class="kind" id="kind"></span>
    <div class="near" id="near"></div>
  </section>
  <section class="card finish" id="finish" hidden>
    <b>다 했어요 🎉</b>
    아래 버튼으로 파일을 저장해서 보내주세요.
  </section>

  <div class="grid" id="grid"></div>
  <section class="pays" id="pays" hidden></section>
  <button class="same" id="same" hidden></button>
  <input class="memo" id="memo" placeholder="메모 (선택) 예: 친구랑 노래방">
  <div class="nav">
    <button id="prev">← 이전</button>
    <button id="skip">모르겠어요</button>
    <button id="next">다음 →</button>
  </div>
  <button class="save" id="save">정답 파일 저장</button>
  <p class="hint">숫자키로도 고를 수 있어요. 고른 건 이 브라우저에 자동 저장돼요.</p>
</div>

<script>
const DATA = /*DATA*/;
const KEY = "label-answers-" + DATA.key;
const won = n => n.toLocaleString("ko-KR") + "원";
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} };
const rows = DATA.rows;
const answered = r => answers[r.id] && answers[r.id].category;
let i = Math.max(0, rows.findIndex(r => !answered(r)));
if (rows.every(answered)) i = rows.length;

const $ = id => document.getElementById(id);
const choices = r => r.in ? DATA.income : DATA.categories;  // 들어온 돈은 따로 (정산·용돈·알바비…)
let gridFor = null;
function drawGrid(r) {
  if (gridFor === r.in) return;
  gridFor = r.in;
  $("grid").innerHTML = choices(r).map((c, k) =>
    `<button class="cat" data-cat="${c.name}" title="${c.description || ""}">` +
    (k < 10 ? `<span class="k">${(k + 1) % 10}</span>` : "") +
    `<span class="e">${c.emoji}</span>${c.name}</button>`).join("");
}

function sameLeft(r) {
  // 친구 이름은 매번 용도가 달라서 들어온 돈에는 '한 번에 정하기'를 쓰지 않는다
  return r.in ? [] : rows.filter(o => o.id !== r.id && !o.in && o.name === r.name && !answered(o));
}

function drawPays(r, a) {
  const show = r.in && a.category === "정산";
  $("pays").hidden = !show;
  if (!show) return;
  const chosen = new Set(a.pays || []);
  $("pays").innerHTML = "<h3>어느 결제의 몫인가요? (여러 개 가능)</h3>" + (r.pays.length
    ? r.pays.map(p => `<label><input type="checkbox" value="${p.id}" ${chosen.has(p.id) ? "checked" : ""}>` +
        `<span class="t">${p.when}</span><span class="n">${esc(p.name)}</span>` +
        `<span class="a">${won(p.amount)}</span></label>`).join("")
    : "") + "<p>목록에 없거나 모르겠으면 고르지 않고 다음으로 넘어가도 돼요.</p>";
}

function render() {
  const total = rows.length, done = rows.filter(answered).length;
  $("count").textContent = `${done} / ${total}`;
  $("bar").style.width = (done / total * 100) + "%";
  const end = i >= total;
  $("card").hidden = end; $("finish").hidden = !end;
  $("prev").disabled = i === 0;
  if (end) { $("same").hidden = true; $("pays").hidden = true; return; }
  const r = rows[i], a = answers[r.id] || {};
  drawGrid(r);
  drawPays(r, a);
  $("when").textContent = r.when;
  $("name").textContent = r.name;
  $("amount").textContent = (r.in ? "+" : "-") + won(r.amount);
  $("amount").classList.toggle("in", r.in);
  $("dir").textContent = r.in ? "들어온 돈" : "나간 돈";
  $("dir").classList.toggle("in", r.in);
  $("kind").textContent = r.kind || (r.in ? "입금" : "결제");
  $("badge").hidden = !a.category;
  $("near").innerHTML = r.near.length
    ? "<h3>앞뒤 2시간 거래</h3>" + r.near.map(n =>
        `<div><span class="t">${n.time}</span><span class="n">${esc(n.name)}</span>` +
        `<span class="a ${n.in ? "in" : ""}">${n.in ? "+" : "-"}${won(n.amount)}</span></div>`).join("")
    : "";
  document.querySelectorAll(".cat").forEach(b => b.classList.toggle("on", b.dataset.cat === a.category));
  $("memo").value = a.memo || "";
  const left = a.category ? sameLeft(r) : [];
  $("same").hidden = !left.length;
  $("same").textContent = `'${r.name}' 남은 ${left.length}건도 ${a.category}(으)로`;
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function pick(cat) {
  const r = rows[i];
  answers[r.id] = { ...(answers[r.id] || {}), category: cat };
  if (cat !== "정산") delete answers[r.id].pays;
  persist();
  // 같은 이름이 더 있으면 한 번에 정할 기회를, 정산이면 결제를 고를 기회를 준다
  if (sameLeft(r).length || (r.in && cat === "정산" && r.pays.length)) { render(); return; }
  go(1);
}
$("pays").addEventListener("change", () => {
  const r = rows[i];
  answers[r.id].pays = [...$("pays").querySelectorAll("input:checked")].map(x => Number(x.value));
  persist();
});
function go(step) {
  i = Math.min(rows.length, Math.max(0, i + step));
  render();
  window.scrollTo({ top: 0 });
}

$("grid").addEventListener("click", e => {
  const b = e.target.closest(".cat");
  if (b && i < rows.length) pick(b.dataset.cat);
});
$("same").onclick = () => {
  const r = rows[i], cat = answers[r.id].category;
  sameLeft(r).forEach(o => { answers[o.id] = { ...(answers[o.id] || {}), category: cat }; });
  persist();
  go(1);
};
$("memo").oninput = e => {
  const r = rows[i];
  if (!r) return;
  answers[r.id] = { ...(answers[r.id] || {}), memo: e.target.value };
  persist();
};
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("skip").onclick = () => {
  const r = rows[i];
  if (r && answers[r.id]) { delete answers[r.id].category; persist(); }
  go(1);
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (/^[0-9]$/.test(e.key)) {
    const c = i < rows.length && choices(rows[i])[(Number(e.key) + 9) % 10];
    if (c && i < rows.length) pick(c.name);
  } else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "ArrowRight") go(1);
});
$("save").onclick = () => {
  const q = s => `"${String(s || "").replace(/"/g, '""')}"`;
  const lines = ["번호,방향,정답,정산결제,메모",
    ...rows.filter(r => answers[r.id] && (answers[r.id].category || answers[r.id].memo)).map(r => {
      const a = answers[r.id];
      return [r.id, r.in ? "들어옴" : "나감", q(a.category), q((a.pays || []).join(" ")), q(a.memo)].join(",");
    })];
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "정답.csv";
  a.click();
};
render();
</script>
</body>
</html>
